[project]
name = "slim"
version = "0.1.0"
description = "Simple HTTP backend framework written in Python."
authors = [
    {name = "Łukasz Wieczorek",email = "luke@soiree.tech"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pylint (>=4.0.4,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
disable = "C0114, C0115, C0116, R0903, W0621"
